<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Blog - Famagusta Dart Club</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="shortcut icon" href="../files/media/images/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .blog-shell {
            padding: 7rem 0 3rem;
            display: grid;
            gap: 1.75rem;
        }

        .surface,
        .blog-post,
        .comment-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 1.5rem;
        }

        .blog-post {
            display: grid;
            gap: 1rem;
            background:
                radial-gradient(circle at top right, rgba(255, 107, 53, 0.08), transparent 32%),
                rgba(255, 255, 255, 0.04);
        }

        .blog-form-grid {
            display: grid;
            gap: 0.9rem;
        }

        input[type="text"],
        textarea,
        input[type="file"],
        select {
            width: 100%;
            padding: 0.8rem 0.9rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.18);
            color: #fff;
        }

        .post-meta,
        .comment-meta,
        .reaction-row,
        .comment-actions {
            display: flex;
            gap: 0.85rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .post-image {
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            border-radius: 16px;
        }

        .comment-list {
            display: grid;
            gap: 0.75rem;
        }

        .membership-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(255, 107, 53, 0.18);
            color: #ffd7ca;
        }

        .hero-surface {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            background:
                radial-gradient(circle at top right, rgba(255, 107, 53, 0.12), transparent 34%),
                radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.06), transparent 40%),
                rgba(255, 255, 255, 0.04);
        }

        .summary-strip {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 1rem 1.1rem;
        }

        .summary-card strong {
            display: block;
            color: #fff;
            font-size: 1.45rem;
        }

        .summary-card span {
            color: var(--text-color);
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container">
            <a href="main.php" class="nav__logo">
                <img src="../files/media/images/logo.png" alt="logo"> Famagusta Dart Club
            </a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list"></ul>
                <div class="nav__close" id="nav-close">
                    <i class="ri-close-line"></i>
                </div>
            </div>
            <div class="nav__toggle" id="nav-toggle">
                <i class="ri-menu-line"></i>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="blog-shell container" id="blog-shell">
            <div class="surface">Loading the club blog...</div>
        </section>
    </main>

    <a href="#top" class="scrollup" id="scroll-up">
        <i class="ri-arrow-up-line"></i>
    </a>

    <script src="../js/scrollreveal.min.js"></script>
    <script src="../js/behaviour.js?v=20260402-2"></script>
    <script>
        let sessionContext = null;

        function createPostForm() {
            if (!sessionContext?.can_author_blog) {
                return '';
            }

            return `
                <section class="surface">
                    <h2>Create a blog post</h2>
                    <p style="color: var(--text-color); margin: 0.75rem 0 1rem;">
                        ${
                          sessionContext.can_publish_blog
                            ? 'Managers and admins can publish immediately or save drafts.'
                            : 'Approved club members create drafts first. Managers and admins publish them after review.'
                        }
                    </p>
                    <form id="blog-create-form" class="blog-form-grid">
                        <input name="title" type="text" placeholder="Post title" required>
                        <textarea name="content" rows="6" placeholder="Write your update here..." required></textarea>
                        <input name="image" type="file" accept="image/*">
                        ${sessionContext.can_publish_blog ? `
                            <select name="status">
                                <option value="draft">Save draft</option>
                                <option value="published">Publish now</option>
                            </select>
                        ` : '<input type="hidden" name="status" value="draft">'}
                        <button type="submit" class="button">Save post</button>
                    </form>
                </section>
            `;
        }

        function renderCommentBlock(post) {
            return `
                <div class="comment-list">
                    ${post.comments.map((comment) => `
                        <article class="comment-card">
                            <div class="comment-meta">
                                <strong>${comment.user_name}</strong>
                                <span style="color: var(--text-color);">${new Date(comment.created_at).toLocaleString()}</span>
                            </div>
                            <p style="margin-top: 0.75rem;">${comment.comment_content}</p>
                            ${
                              sessionContext?.logged_in && (sessionContext.can_publish_blog || Number(comment.user_id) === Number(sessionContext.user_id))
                                ? `<div class="comment-actions" style="margin-top: 0.75rem;"><button type="button" onclick="deleteComment(${comment.comment_id})">Delete</button></div>`
                                : ''
                            }
                        </article>
                    `).join('')}
                    ${post.comments.length === 0 ? '<p style="color: var(--text-color);">No comments yet.</p>' : ''}
                </div>
            `;
        }

        function renderPost(post) {
            return `
                <article class="blog-post">
                    <div class="post-meta">
                        <span class="membership-chip">${post.status}</span>
                        <span style="color: var(--text-color);">By ${post.author || 'Club staff'}</span>
                        <span style="color: var(--text-color);">${new Date(post.published_at || post.created_at).toLocaleString()}</span>
                    </div>
                    <div>
                        <h2>${post.blog_title}</h2>
                        <div style="margin-top: 0.85rem;">${post.blog_content}</div>
                    </div>
                    ${post.images.length > 0 ? `<img class="post-image" src="${post.images[0].file_path}" alt="${post.images[0].title || post.blog_title}">` : ''}
                    <div class="reaction-row">
                        <button type="button" onclick="toggleLike(${post.blog_id})">${post.viewer_has_liked ? 'Unlike' : 'Like'} (${post.like_count})</button>
                        <span style="color: var(--text-color);">${post.comment_count} comments</span>
                        ${
                          post.viewer_can_publish
                            ? `<button type="button" onclick="publishPost(${post.blog_id})">Publish</button>`
                            : ''
                        }
                        ${
                          post.viewer_can_delete
                            ? `<button type="button" class="cancel-btn" onclick="deletePost(${post.blog_id})">Delete</button>`
                            : ''
                        }
                    </div>
                    <div>
                        <h3>Comments</h3>
                        <div style="margin-top: 0.85rem;">
                            ${renderCommentBlock(post)}
                        </div>
                    </div>
                    ${
                      sessionContext?.logged_in
                        ? `
                            <form onsubmit="submitComment(event, ${post.blog_id})" class="blog-form-grid">
                                <textarea name="content" rows="3" placeholder="Share your thoughts..." required></textarea>
                                <button type="submit" class="button">Add comment</button>
                            </form>
                          `
                        : '<p style="color: var(--text-color);">Sign in to comment and react.</p>'
                    }
                </article>
            `;
        }

        async function loadBlogPage() {
            const [contextResponse, postsResponse] = await Promise.all([
                fetch('../services/get_session_context.php'),
                fetch('../services/get_blogs.php?page=1&pageSize=20')
            ]);

            sessionContext = await contextResponse.json();
            const postsPayload = await postsResponse.json();
            if (!Array.isArray(postsPayload.items)) {
                throw new Error(postsPayload.error || 'Failed to load blog posts.');
            }

            const shell = document.getElementById('blog-shell');
            shell.innerHTML = `
                <section class="surface hero-surface">
                    <div>
                        <div class="membership-chip"><i class="ri-article-line"></i> Club stories</div>
                        <h1 style="margin-top: 1rem;">Club Blog</h1>
                        <p style="color: var(--text-color); margin-top: 0.85rem;">
                            Match reports, tournament recaps, club updates, and member stories all live here in one place.
                        </p>
                    </div>
                    <div>
                        <h3>Publishing flow</h3>
                        <p style="color: var(--text-color); margin-top: 0.75rem;">
                            Approved members write drafts. Managers and admins can publish, moderate, and keep the public feed tidy.
                        </p>
                    </div>
                </section>
                <section class="summary-strip">
                    <article class="summary-card"><strong>${postsPayload.items.length}</strong><span>Visible posts</span></article>
                    <article class="summary-card"><strong>${postsPayload.items.reduce((total, post) => total + Number(post.comment_count || 0), 0)}</strong><span>Total comments</span></article>
                    <article class="summary-card"><strong>${postsPayload.items.reduce((total, post) => total + Number(post.like_count || 0), 0)}</strong><span>Total likes</span></article>
                    <article class="summary-card"><strong>${sessionContext?.can_author_blog ? 'Yes' : 'No'}</strong><span>You can draft posts</span></article>
                </section>
                ${createPostForm()}
                <section style="display: grid; gap: 1rem;">
                    ${postsPayload.items.length > 0 ? postsPayload.items.map(renderPost).join('') : '<div class="surface">No blog posts available yet.</div>'}
                </section>
            `;

            const form = document.getElementById('blog-create-form');
            if (form) {
                form.addEventListener('submit', submitPost);
            }
        }

        async function submitPost(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const formData = new FormData(form);
            const response = await fetch('../services/create_blog.php', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (!data.success) {
                window.alert(data.message || 'Failed to save post.');
                return;
            }

            window.alert(data.message);
            await loadBlogPage();
        }

        async function publishPost(blogId) {
            const response = await fetch('../services/update_blog_status.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ blog_id: blogId, status: 'published' })
            });
            const data = await response.json();
            if (!data.success) {
                window.alert(data.message || 'Failed to publish post.');
                return;
            }

            await loadBlogPage();
        }

        async function deletePost(blogId) {
            if (!window.confirm('Delete this blog post?')) {
                return;
            }
            const response = await fetch('../services/delete_blog.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ blog_id: blogId })
            });
            const data = await response.json();
            if (!data.success) {
                window.alert(data.message || 'Failed to delete post.');
                return;
            }

            await loadBlogPage();
        }

        async function submitComment(event, blogId) {
            event.preventDefault();
            const form = event.currentTarget;
            const content = new FormData(form).get('content');
            const response = await fetch('../services/create_blog_comment.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ blog_id: blogId, content })
            });
            const data = await response.json();
            if (!data.success) {
                window.alert(data.message || 'Failed to add comment.');
                return;
            }

            await loadBlogPage();
        }

        async function deleteComment(commentId) {
            const response = await fetch('../services/delete_blog_comment.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ comment_id: commentId })
            });
            const data = await response.json();
            if (!data.success) {
                window.alert(data.message || 'Failed to delete comment.');
                return;
            }

            await loadBlogPage();
        }

        async function toggleLike(blogId) {
            const response = await fetch('../services/toggle_blog_reaction.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ blog_id: blogId })
            });
            const data = await response.json();
            if (!data.success) {
                window.alert(data.message || 'Failed to update reaction.');
                return;
            }

            await loadBlogPage();
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadBlogPage().catch((error) => {
                document.getElementById('blog-shell').innerHTML = `<div class="surface">${error.message}</div>`;
            });
        });
    </script>
</body>
</html>
