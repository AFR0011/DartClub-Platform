<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="shortcut icon" href="../files/media/images/logo.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/login_style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>Famagusta Dart Club</title>
</head>

<body class="auth-shell-page">
  <top id="top"></top>
  <header class="header" id="header">
    <nav class="nav container">
      <a href="main.php" class="nav__logo">
        <img src="../files/media/images/logo.png" alt="logo" /> Famagusta Dart Club
      </a>
    </nav>
  </header>


  <main class="main">
    <div class="box">
      <div class="login">
        <div class="loginBx">
          <h2><i class="ri-login-box-line"></i><span data-i18n-en="Login" data-i18n-tr="Giris Yap">Login</span><i class="ri-flashlight-line"></i></h2>
          <div class="auth-reveal">
            <form id="login-form">
              <label class="sr-only" for="email">Email address</label>
              <input type="email" id="email" placeholder="Email..." data-i18n-en="Email..." data-i18n-tr="E-posta..." data-i18n-attr="placeholder" autocomplete="email" required>
              <label class="sr-only" for="password">Password</label>
              <input type="password" id="password" placeholder="Password..." data-i18n-en="Password..." data-i18n-tr="Sifre..." data-i18n-attr="placeholder" autocomplete="current-password" required>
              <input type="submit" value="Sign In" data-i18n-en="Sign In" data-i18n-tr="Giris Yap" data-i18n-attr="value">
            </form>
            <div id="error-message" role="status" aria-live="polite"></div>
            <p class="auth-support" data-i18n-en="Need access help? Contact a club admin." data-i18n-tr="Giris yardimina mi ihtiyaciniz var? Bir kulup yoneticisiyle iletisime gecin.">Need access help? Contact a club admin.</p>
            <div class="group">
              <a href="reset_password.html" data-i18n-en="Forgot Password" data-i18n-tr="Sifremi Unuttum">Forgot Password</a>
              <a href="sign_up.html" data-i18n-en="Sign Up" data-i18n-tr="Kayit Ol">Sign Up</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>




  <!-- Scroll reveal -->
  <script src="../js/scrollreveal.min.js"></script>

  <!--primary js file-->
    <script src="../js/behaviour.js?v=20260413-1"></script>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
      event.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      window.appFetchJson('../services/login.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email: email, password: password })
      })
      .then(data => {
        if (data.success) {
          window.location.href = data.redirect_to || 'main.php';
        } else {
          document.getElementById('error-message').innerText = data.message;
        }
      })
      .catch(error => {
        console.error('Error:', error);
        document.getElementById('error-message').innerText = error.message || 'An error occurred during login.';
      });
    });
  </script>
</body>

</html>
