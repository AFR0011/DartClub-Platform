  <link rel="shortcut icon" href="../files/media/images/logo.png" />

  <title>Famagusta Dart Club</title>

<body class="auth-shell-page">
  <top id="top"></top>
  <header class="header" id="header">
    <nav class="nav container">
      <a href="main.php" class="nav__logo">
        <img src="../files/media/images/logo.png" alt="logo" /> Famagusta Dart Club
      </a>
    </nav>
  </header>


  <main class="main">
    <div class="box">
      <div class="login">
        <div class="loginBx">
          <h2><i class="ri-login-box-line"></i><span data-i18n-en="Sign Up" data-i18n-tr="Kayit Ol">Sign Up</span><i class="ri-flashlight-line"></i></h2>
          <div class="auth-reveal">
            <form id="signup-form">
              <label class="sr-only" for="username">Username</label>
              <input type="text" id="username" placeholder="Username..." data-i18n-en="Username..." data-i18n-tr="Kullanici adi..." data-i18n-attr="placeholder" autocomplete="username" required>
              <label class="sr-only" for="email">Email address</label>
              <input type="email" id="email" placeholder="Email..." data-i18n-en="Email..." data-i18n-tr="E-posta..." data-i18n-attr="placeholder" autocomplete="email" required>
              <label class="sr-only" for="password">Password</label>
              <input type="password" id="password" placeholder="Password..." data-i18n-en="Password..." data-i18n-tr="Sifre..." data-i18n-attr="placeholder" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" title="Use at least 8 characters with at least one letter and one number." required>
              <label class="sr-only" for="password2">Repeat password</label>
              <input type="password" id="password2" placeholder="Repeat Password..." data-i18n-en="Repeat Password..." data-i18n-tr="Sifreyi tekrar edin..." data-i18n-attr="placeholder" autocomplete="new-password" required>
              <input type="submit" value="Sign Up" data-i18n-en="Sign Up" data-i18n-tr="Kayit Ol" data-i18n-attr="value">
            </form>
            <div id="error-message" role="status" aria-live="polite"></div>
            <div class="group">
              <a href="login.html" data-i18n-en="Already have an account? Login" data-i18n-tr="Zaten hesabin var mi? Giris yap">Already have an account? Login</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>




  <!-- Scroll reveal -->
  <script src="../js/scrollreveal.min.js"></script>

  <!--primary js file-->
    <script src="../js/behaviour.js?v=20260413-1"></script>

  <script>
   document.getElementById('signup-form').addEventListener('submit', function(event) {
  event.preventDefault();
  
  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  
  if (password !== password2) {
    document.getElementById('error-message').innerText = 'Passwords do not match';
    return;
  }

  if (!/(?=.*[A-Za-z])(?=.*[0-9]).{8,}/.test(password)) {
    document.getElementById('error-message').innerText =
      window.getAppLocale && window.getAppLocale() === 'tr'
        ? 'Sifre en az 8 karakter olmali ve en az bir harf ile bir rakam icermelidir.'
        : 'Password must be at least 8 characters and include at least one letter and one number.';
    return;
  }

  window.appFetchJson('../services/signup.php', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ username: username, email: email, password: password })
  })
  .then(data => {
    if (data.success) {
      window.location.href = 'login.html';
    } else {
      document.getElementById('error-message').innerText = data.message;
    }
  })
  .catch(error => {
    console.error('Error:', error);
    document.getElementById('error-message').innerText = error.message || 'An error occurred during sign up.';
  });
});
  </script>
</body>

</html>
