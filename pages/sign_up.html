  <title>Famagusta Dart Club</title>
</head>

<body>
  <top id="top"></top>
  <header class="header" id="header">
    <nav class="nav container">
      <a href="main.php" class="nav__logo">
        <img src="../files/media/images/logo.png" alt="logo" /> Famagusta Dart Club
      </a>
    </nav>
  </header>


  <main class="main">
    <div class="box">
      <div class="login">
        <div class="loginBx">
          <h2><i class="ri-login-box-line"></i>Sign Up<i class="ri-flashlight-line"></i></h2>
          <form id="signup-form">
            <input type="text" id="username" placeholder="Username..." required>
            <input type="email" id="email" placeholder="Email..." required>
            <input type="password" id="password" placeholder="Password..." required>
            <input type="password" id="password2" placeholder="Repeat Password..." required>
            <input type="submit" value="Sign Up">
          </form>
          <div id="error-message"></div>
          <div class="group">
            <a href="login.html"><pre>Already have an account? Login</pre></a>
          </div>
        </div>
      </div>
    </div>
  </main>




  <!-- Scroll reveal -->
  <script src="../js/scrollreveal.min.js"></script>

  <!--primary js file-->
    <script src="../js/behaviour.js?v=20260402-2"></script>

  <script>
   document.getElementById('signup-form').addEventListener('submit', function(event) {
  event.preventDefault();
  
  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  
  if (password !== password2) {
    document.getElementById('error-message').innerText = 'Passwords do not match';
    return;
  }

  fetch('../services/signup.php', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ username: username, email: email, password: password })
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      window.location.href = 'login.html';
    } else {
      document.getElementById('error-message').innerText = data.message;
    }
  })
  .catch(error => {
    console.error('Error:', error);
    document.getElementById('error-message').innerText = 'An error occurred during sign up.';
  });
});
  </script>
</body>

</html>
