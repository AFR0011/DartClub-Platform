<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Dashboard - Famagusta Dart Club</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="shortcut icon" href="../files/media/images/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .dashboard-shell {
            padding: 7rem 0 3rem;
            display: grid;
            gap: 1.5rem;
        }

        .surface,
        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 1.4rem;
        }

        .hero-grid,
        .stats-grid,
        .panel-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .form-grid {
            display: grid;
            gap: 0.9rem;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem 0.85rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(0, 0, 0, 0.18);
            color: #fff;
        }

        .list-card {
            padding: 1rem 1.1rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ghost-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.1rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .membership-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(255, 107, 53, 0.18);
            color: #ffd7ca;
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container">
            <a href="main.php" class="nav__logo">
                <img src="../files/media/images/logo.png" alt="logo"> Famagusta Dart Club
            </a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list"></ul>
                <div class="nav__close" id="nav-close">
                    <i class="ri-close-line"></i>
                </div>
            </div>
            <div class="nav__toggle" id="nav-toggle">
                <i class="ri-menu-line"></i>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="dashboard-shell container" id="dashboard-shell">
            <div class="surface">Loading your dashboard...</div>
        </section>
    </main>

    <a href="#top" class="scrollup" id="scroll-up">
        <i class="ri-arrow-up-line"></i>
    </a>

    <script src="../js/scrollreveal.min.js"></script>
    <script src="../js/behaviour.js"></script>
    <script>
        function renderTournamentCards(tournaments) {
            if (!tournaments || tournaments.length === 0) {
                return '<p style="color: var(--text-color);">No tournaments joined yet.</p>';
            }

            return tournaments.map((tournament) => `
                <article class="list-card">
                    <h3>${tournament.tour_title}</h3>
                    <p style="color: var(--text-color); margin-top: 0.5rem;">${tournament.tour_type} - ${tournament.status}</p>
                    <p style="color: var(--text-color); margin-top: 0.35rem;">Player status: ${tournament.player_status}</p>
                    <a href="tournament_details.php?id=${tournament.tour_id}" class="ghost-button" style="margin-top: 0.85rem; display: inline-flex;">Open</a>
                </article>
            `).join('');
        }

        function renderMatchCards(matches) {
            if (!matches || matches.length === 0) {
                return '<p style="color: var(--text-color);">No upcoming matches scheduled yet.</p>';
            }

            return matches.map((match) => `
                <article class="list-card">
                    <strong>${match.player1_name} vs ${match.player2_name}</strong>
                    <p style="color: var(--text-color); margin-top: 0.45rem;">${match.tour_title}</p>
                    <p style="color: var(--text-color);">${match.match_date} at ${match.match_time}</p>
                </article>
            `).join('');
        }

        function profileForm(player) {
            return `
                <form id="profile-form">
                    <div class="form-grid">
                        <div>
                            <label for="plr_name">First name</label>
                            <input id="plr_name" name="plr_name" value="${player?.plr_name || ''}" required>
                        </div>
                        <div>
                            <label for="plr_surname">Surname</label>
                            <input id="plr_surname" name="plr_surname" value="${player?.plr_surname || ''}" required>
                        </div>
                        <div>
                            <label for="plr_phone">Phone</label>
                            <input id="plr_phone" name="plr_phone" value="${player?.plr_phone || ''}">
                        </div>
                        <div>
                            <label for="plr_dob">Date of birth</label>
                            <input id="plr_dob" name="plr_dob" type="date" value="${player?.plr_dob || ''}">
                        </div>
                        <div>
                            <label for="plr_pob">Place of birth</label>
                            <input id="plr_pob" name="plr_pob" value="${player?.plr_pob || ''}">
                        </div>
                        <div>
                            <label for="plr_address">Address</label>
                            <input id="plr_address" name="plr_address" value="${player?.plr_address || ''}">
                        </div>
                        <div>
                            <label for="plr_father">Father's name</label>
                            <input id="plr_father" name="plr_father" value="${player?.plr_father || ''}">
                        </div>
                        <div>
                            <label for="plr_mother">Mother's name</label>
                            <input id="plr_mother" name="plr_mother" value="${player?.plr_mother || ''}">
                        </div>
                    </div>
                    <button type="submit" class="button" style="margin-top: 1rem;">Save profile</button>
                </form>
            `;
        }

        function renderDashboard(data) {
            const shell = document.getElementById('dashboard-shell');
            const user = data.user;
            const player = data.player && data.player.plr_idNum ? data.player : null;
            const membership = data.membership_application;

            shell.innerHTML = `
                <section class="surface">
                    <div class="hero-grid">
                        <div>
                            <div class="membership-chip"><i class="ri-shield-user-line"></i> ${user.membership_status.replaceAll('_', ' ')}</div>
                            <h1 style="margin-top: 1rem;">${user.user_name}</h1>
                            <p style="color: var(--text-color); margin-top: 0.75rem;">${user.email}</p>
                            <p style="color: var(--text-color); margin-top: 0.35rem;">Role: ${user.user_role}</p>
                        </div>
                        <div>
                            <h3>Membership workflow</h3>
                            <p style="color: var(--text-color); margin-top: 0.75rem;">
                                ${
                                  membership
                                    ? `Latest application: ${membership.status} (${membership.submitted_at})`
                                    : 'No membership application submitted yet.'
                                }
                            </p>
                            <p style="color: var(--text-color); margin-top: 0.35rem;">
                                ${user.membership_status === 'approved' ? 'You can now create blog drafts as a club member.' : 'Complete your player profile, then apply from the membership page.'}
                            </p>
                        </div>
                    </div>
                </section>

                <section class="stats-grid">
                    <article class="stat-card"><strong>${data.stats.registered_tournaments}</strong><p style="color: var(--text-color); margin-top: 0.45rem;">Registered tournaments</p></article>
                    <article class="stat-card"><strong>${data.stats.active_tournaments}</strong><p style="color: var(--text-color); margin-top: 0.45rem;">Active tournaments</p></article>
                    <article class="stat-card"><strong>${data.stats.individual_matches_won} / ${data.stats.individual_matches_played}</strong><p style="color: var(--text-color); margin-top: 0.45rem;">Individual wins / played</p></article>
                    <article class="stat-card"><strong>${data.stats.team_matches_won} / ${data.stats.team_matches_played}</strong><p style="color: var(--text-color); margin-top: 0.45rem;">Team wins / played</p></article>
                </section>

                <section class="panel-grid">
                    <div class="surface">
                        <h2>Player Profile</h2>
                        <p style="color: var(--text-color); margin: 0.75rem 0 1rem;">This profile powers tournament registration and membership applications.</p>
                        ${profileForm(player)}
                    </div>
                    <div class="surface">
                        <h2>Upcoming Matches</h2>
                        <div style="display: grid; gap: 0.85rem; margin-top: 1rem;">
                            ${renderMatchCards(data.upcoming_matches)}
                        </div>
                    </div>
                </section>

                <section class="surface">
                    <h2>My Tournaments</h2>
                    <div style="display: grid; gap: 0.85rem; margin-top: 1rem;">
                        ${renderTournamentCards(data.tournaments)}
                    </div>
                </section>
            `;

            const form = document.getElementById('profile-form');
            form.addEventListener('submit', saveProfile);
        }

        async function saveProfile(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const payload = Object.fromEntries(new FormData(form).entries());

            const response = await fetch('../services/save_profile.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!data.success) {
                window.alert(data.message || 'Failed to save profile.');
                return;
            }

            window.alert('Profile saved successfully.');
            loadDashboard();
        }

        async function loadDashboard() {
            const response = await fetch('../services/get_player_dashboard.php');
            const data = await response.json();
            if (!data.success) {
                throw new Error(data.message || 'Failed to load your dashboard.');
            }

            renderDashboard(data);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard().catch((error) => {
                document.getElementById('dashboard-shell').innerHTML = `<div class="surface">${error.message}</div>`;
            });
        });
    </script>
</body>
</html>
