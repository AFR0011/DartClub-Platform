<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Dashboard - Famagusta Dart Club</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="shortcut icon" href="../files/media/images/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .dashboard-shell {
            padding: 7rem 0 3rem;
            display: grid;
            gap: 1.5rem;
        }

        .surface,
        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 1.4rem;
        }

        .hero-grid,
        .stats-grid,
        .panel-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .form-grid {
            display: grid;
            gap: 0.9rem;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem 0.85rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(0, 0, 0, 0.18);
            color: #fff;
        }

        .list-card {
            padding: 1rem 1.1rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ghost-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.1rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .membership-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(255, 107, 53, 0.18);
            color: #ffd7ca;
        }

        .profile-form {
            display: grid;
            gap: 1rem;
        }

        .profile-form-shell {
            display: grid;
            gap: 1rem;
        }

        .profile-field {
            padding: 1rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.04)),
                rgba(8, 15, 27, 0.42);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02), 0 14px 28px rgba(0, 0, 0, 0.12);
        }

        .profile-label {
            display: block;
            margin-bottom: 0.55rem;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.92);
        }

        .profile-input {
            width: 100%;
            padding: 0.95rem 1rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(5, 10, 19, 0.68);
            color: #fff;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 16px 30px rgba(0, 0, 0, 0.18);
            transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
        }

        .profile-input::placeholder {
            color: rgba(226, 232, 240, 0.58);
        }

        .profile-input:focus {
            outline: none;
            border-color: rgba(255, 107, 53, 0.45);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.12), 0 18px 34px rgba(0, 0, 0, 0.22);
            transform: translateY(-1px);
        }

        .profile-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.85rem;
        }

        .profile-save-note {
            color: var(--text-color);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .onboarding-banner {
            display: grid;
            gap: 0.45rem;
            padding: 1rem 1.1rem;
            border-radius: 18px;
            border: 1px solid rgba(255, 107, 53, 0.24);
            background:
                radial-gradient(circle at top right, rgba(255, 107, 53, 0.16), transparent 42%),
                rgba(255, 255, 255, 0.04);
        }

        .onboarding-banner strong {
            color: #fff;
            font-size: 1rem;
        }

        .onboarding-banner p {
            color: var(--text-color);
            margin: 0;
            line-height: 1.6;
        }

        @media (max-width: 720px) {
            .profile-actions {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container">
            <a href="main.php" class="nav__logo">
                <img src="../files/media/images/logo.png" alt="logo"> Famagusta Dart Club
            </a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list"></ul>
                <div class="nav__close" id="nav-close">
                    <i class="ri-close-line"></i>
                </div>
            </div>
            <div class="nav__toggle" id="nav-toggle">
                <i class="ri-menu-line"></i>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="dashboard-shell container" id="dashboard-shell">
            <div class="surface">Loading your dashboard...</div>
        </section>
    </main>

    <a href="#top" class="scrollup" id="scroll-up">
        <i class="ri-arrow-up-line"></i>
    </a>

    <script src="../js/scrollreveal.min.js"></script>
    <script src="../js/behaviour.js?v=20260409-1"></script>
    <script>
        const profilePageParams = new URLSearchParams(window.location.search);
        let onboardingRequested = profilePageParams.get('onboarding') === '1';

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderTournamentCards(tournaments) {
            if (!tournaments || tournaments.length === 0) {
                return '<p style="color: var(--text-color);">No tournaments joined yet.</p>';
            }

            return tournaments.map((tournament) => `
                <article class="list-card">
                    <h3>${tournament.tour_title}</h3>
                    <p style="color: var(--text-color); margin-top: 0.5rem;">${tournament.tour_type} - ${tournament.status}</p>
                    <p style="color: var(--text-color); margin-top: 0.35rem;">Player status: ${tournament.player_status}</p>
                    <a href="tournament_details.php?id=${tournament.tour_id}" class="ghost-button" style="margin-top: 0.85rem; display: inline-flex;">Open</a>
                </article>
            `).join('');
        }

        function renderMatchCards(matches) {
            if (!matches || matches.length === 0) {
                return '<p style="color: var(--text-color);">No upcoming matches scheduled yet.</p>';
            }

            return matches.map((match) => `
                <article class="list-card">
                    <strong>${match.player1_name} vs ${match.player2_name}</strong>
                    <p style="color: var(--text-color); margin-top: 0.45rem;">${match.tour_title}</p>
                    <p style="color: var(--text-color);">${match.match_date} at ${match.match_time}</p>
                </article>
            `).join('');
        }

        function profileForm(player, needsOnboarding = false) {
            const saveLabel = needsOnboarding ? 'Finish onboarding' : 'Save profile';
            const saveNote = needsOnboarding
                ? 'These details create the player record used for tournament registration, standings, and membership review.'
                : 'Keep this information current so tournament registrations and membership applications stay in sync.';

            return `
                <form id="profile-form" class="profile-form">
                    ${needsOnboarding ? `
                        <div class="onboarding-banner">
                            <strong>Complete your player profile</strong>
                            <p>Your account is active, but tournament and membership flows need your player details before you can continue.</p>
                        </div>
                    ` : ''}
                    <div class="profile-form-shell">
                        <div class="form-grid">
                        <div class="profile-field">
                            <label class="profile-label" for="plr_name">First name</label>
                            <input class="profile-input" id="plr_name" name="plr_name" value="${escapeHtml(player?.plr_name || '')}" placeholder="Enter your first name" required>
                        </div>
                        <div class="profile-field">
                            <label class="profile-label" for="plr_surname">Surname</label>
                            <input class="profile-input" id="plr_surname" name="plr_surname" value="${escapeHtml(player?.plr_surname || '')}" placeholder="Enter your surname" required>
                        </div>
                        <div class="profile-field">
                            <label class="profile-label" for="plr_phone">Phone</label>
                            <input class="profile-input" id="plr_phone" name="plr_phone" value="${escapeHtml(player?.plr_phone || '')}" placeholder="Add a contact number">
                        </div>
                        <div class="profile-field">
                            <label class="profile-label" for="plr_dob">Date of birth</label>
                            <input class="profile-input" id="plr_dob" name="plr_dob" type="date" value="${escapeHtml(player?.plr_dob || '')}">
                        </div>
                        <div class="profile-field">
                            <label class="profile-label" for="plr_pob">Place of birth</label>
                            <input class="profile-input" id="plr_pob" name="plr_pob" value="${escapeHtml(player?.plr_pob || '')}" placeholder="City or town">
                        </div>
                        <div class="profile-field">
                            <label class="profile-label" for="plr_address">Address</label>
                            <input class="profile-input" id="plr_address" name="plr_address" value="${escapeHtml(player?.plr_address || '')}" placeholder="Street address">
                        </div>
                        <div class="profile-field">
                            <label class="profile-label" for="plr_father">Father's name</label>
                            <input class="profile-input" id="plr_father" name="plr_father" value="${escapeHtml(player?.plr_father || '')}" placeholder="Optional">
                        </div>
                        <div class="profile-field">
                            <label class="profile-label" for="plr_mother">Mother's name</label>
                            <input class="profile-input" id="plr_mother" name="plr_mother" value="${escapeHtml(player?.plr_mother || '')}" placeholder="Optional">
                        </div>
                    </div>
                    </div>
                    <div class="profile-actions">
                        <button type="submit" class="button">${saveLabel}</button>
                        <span class="profile-save-note">${saveNote}</span>
                    </div>
                </form>
            `;
        }

        function renderDashboard(data) {
            const shell = document.getElementById('dashboard-shell');
            const user = data.user;
            const player = data.player && data.player.plr_idNum ? data.player : null;
            const membership = data.membership_application;
            const needsOnboarding = user.user_role === 'player' && (onboardingRequested || !player);

            shell.innerHTML = `
                <section class="surface">
                    <div class="hero-grid">
                        <div>
                            <div class="membership-chip"><i class="ri-shield-user-line"></i> ${user.membership_status.replaceAll('_', ' ')}</div>
                            <h1 style="margin-top: 1rem;">${user.user_name}</h1>
                            <p style="color: var(--text-color); margin-top: 0.75rem;">${user.email}</p>
                            <p style="color: var(--text-color); margin-top: 0.35rem;">Role: ${user.user_role}</p>
                        </div>
                        <div>
                            <h3>Membership workflow</h3>
                            <p style="color: var(--text-color); margin-top: 0.75rem;">
                                ${
                                  membership
                                    ? `Latest application: ${membership.status} (${membership.submitted_at})`
                                    : 'No membership application submitted yet.'
                                }
                            </p>
                            <p style="color: var(--text-color); margin-top: 0.35rem;">
                                ${needsOnboarding
                                    ? 'Finish onboarding by completing your player profile, then continue into tournaments and membership workflow.'
                                    : (user.membership_status === 'approved'
                                        ? 'You can now create blog drafts as a club member.'
                                        : 'Complete your player profile, then apply from the membership page.')}
                            </p>
                        </div>
                    </div>
                </section>

                <section class="stats-grid">
                    <article class="stat-card"><strong>${data.stats.registered_tournaments}</strong><p style="color: var(--text-color); margin-top: 0.45rem;">Registered tournaments</p></article>
                    <article class="stat-card"><strong>${data.stats.active_tournaments}</strong><p style="color: var(--text-color); margin-top: 0.45rem;">Active tournaments</p></article>
                    <article class="stat-card"><strong>${data.stats.individual_matches_won} / ${data.stats.individual_matches_played}</strong><p style="color: var(--text-color); margin-top: 0.45rem;">Individual wins / played</p></article>
                    <article class="stat-card"><strong>${data.stats.team_matches_won} / ${data.stats.team_matches_played}</strong><p style="color: var(--text-color); margin-top: 0.45rem;">Team wins / played</p></article>
                </section>

                <section class="panel-grid">
                    <div class="surface">
                        <h2>Player Profile</h2>
                        <p style="color: var(--text-color); margin: 0.75rem 0 1rem;">${needsOnboarding ? 'Complete these details once so your player record can be used across tournaments and membership applications.' : 'This profile powers tournament registration and membership applications.'}</p>
                        ${profileForm(player, needsOnboarding)}
                    </div>
                    <div class="surface">
                        <h2>Upcoming Matches</h2>
                        <div style="display: grid; gap: 0.85rem; margin-top: 1rem;">
                            ${renderMatchCards(data.upcoming_matches)}
                        </div>
                    </div>
                </section>

                <section class="surface">
                    <h2>My Tournaments</h2>
                    <div style="display: grid; gap: 0.85rem; margin-top: 1rem;">
                        ${renderTournamentCards(data.tournaments)}
                    </div>
                </section>
            `;

            const form = document.getElementById('profile-form');
            form.addEventListener('submit', saveProfile);
        }

        async function saveProfile(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const payload = Object.fromEntries(new FormData(form).entries());

            let data;
            try {
                data = await window.appFetchJson('../services/save_profile.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                window.alert(error.message || 'Failed to save profile.');
                return;
            }

            const wasOnboarding = onboardingRequested;
            if (wasOnboarding) {
                onboardingRequested = false;
                const nextUrl = new URL(window.location.href);
                nextUrl.searchParams.delete('onboarding');
                window.history.replaceState({}, '', nextUrl.toString());
            }

            window.alert(wasOnboarding ? 'Profile saved. Onboarding complete.' : 'Profile saved successfully.');
            loadDashboard();
        }

        async function loadDashboard() {
            const data = await window.appFetchJson('../services/get_player_dashboard.php');
            if (!data.success) {
                throw new Error(data.message || 'Failed to load your dashboard.');
            }

            renderDashboard(data);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard().catch((error) => {
                document.getElementById('dashboard-shell').innerHTML = `<div class="surface">${error.message}</div>`;
            });
        });
    </script>
</body>
</html>
