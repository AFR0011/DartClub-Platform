<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="shortcut icon" href="../files/media/images/logo.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <title>Gallery - Famagusta Dart Club</title>
  <style>
    .gallery-shell {
      padding: 7rem 0 3rem;
      display: grid;
      gap: 1.75rem;
    }

    .surface {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 1.5rem;
    }

    .hero-surface {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      background:
        radial-gradient(circle at top right, rgba(255, 107, 53, 0.12), transparent 34%),
        radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.06), transparent 40%),
        rgba(255, 255, 255, 0.04);
    }

    .summary-strip {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    }

    .summary-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 1rem 1.1rem;
    }

    .summary-card strong {
      display: block;
      color: #fff;
      font-size: 1.45rem;
    }

    .summary-card span {
      color: var(--text-color);
      font-size: 0.92rem;
    }

    .gallery-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .gallery-card {
      overflow: hidden;
      display: grid;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .gallery-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }

    .gallery-card__body {
      padding: 1rem;
      display: grid;
      gap: 0.6rem;
    }

    .gallery-card__title {
      color: #fff;
      font-size: 1rem;
      line-height: 1.45;
    }

    .gallery-card__meta {
      color: var(--text-color);
      font-size: 0.9rem;
    }

    .membership-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      background: rgba(255, 107, 53, 0.18);
      color: #ffd7ca;
    }

    .ui-input,
    .ui-button,
    .ui-button-secondary,
    .ui-button-danger {
      font: inherit;
    }

    .ui-input {
      width: 100%;
      padding: 0.95rem 1rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.2);
      color: #fff;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }

    .ui-input:focus {
      outline: none;
      border-color: rgba(255, 107, 53, 0.38);
      box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.12);
      background: rgba(0, 0, 0, 0.28);
    }

    .upload-form {
      display: grid;
      gap: 0.9rem;
      margin-top: 1rem;
    }

    .ui-button,
    .ui-button-secondary,
    .ui-button-danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.15rem;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }

    .ui-button {
      background: linear-gradient(180deg, #ff7c4d, #ef5a29);
      color: #fff;
      box-shadow: 0 10px 22px rgba(239, 90, 41, 0.2);
    }

    .ui-button-secondary {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .ui-button-danger {
      background: rgba(220, 38, 38, 0.12);
      border-color: rgba(220, 38, 38, 0.25);
      color: #fecaca;
    }

    .ui-button:hover,
    .ui-button-secondary:hover,
    .ui-button-danger:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 22px rgba(255, 92, 92, 0.2), 0 16px 28px rgba(0, 0, 0, 0.18);
    }

    .ui-button:hover {
      background: linear-gradient(180deg, #ff6057, #d7263d);
    }

    .ui-button-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .ui-button-danger:hover {
      background: rgba(220, 38, 38, 0.18);
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 2rem;
    }

    .lightbox-card {
      width: min(1100px, 100%);
      display: grid;
      gap: 1rem;
      justify-items: center;
    }

    .lightbox img {
      max-width: min(100%, 1000px);
      max-height: 78vh;
      border-radius: 16px;
    }

    .lightbox-caption {
      width: min(100%, 780px);
      display: grid;
      gap: 0.7rem;
      text-align: center;
      color: #fff;
    }

    .lightbox-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(7, 12, 20, 0.72);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.22);
    }

    @media (max-width: 1100px) {
      .gallery-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="header" id="header">
    <nav class="nav container">
      <a href="main.php" class="nav__logo">
        <img src="../files/media/images/logo.png" alt="logo" /> Famagusta Dart Club
      </a>
      <div class="nav__menu" id="nav-menu">
        <ul class="nav__list"></ul>
        <div class="nav__close" id="nav-close">
          <i class="ri-close-line"></i>
        </div>
      </div>
      <div class="nav__toggle" id="nav-toggle">
        <i class="ri-menu-line"></i>
      </div>
    </nav>
  </header>

  <main class="main">
    <section class="gallery-shell container" id="gallery-shell">
      <div class="surface">Loading gallery...</div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-card">
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close image preview">
        <i class="ri-close-line"></i>
      </button>
      <img id="lightbox-image" alt="Gallery preview" />
      <div class="lightbox-caption">
        <strong id="lightbox-title">Gallery image</strong>
        <span id="lightbox-meta"></span>
        <div class="lightbox-actions" id="lightbox-actions"></div>
      </div>
    </div>
  </div>

  <a href="#top" class="scrollup" id="scroll-up">
    <i class="ri-arrow-up-line"></i>
  </a>

  <script src="../js/scrollreveal.min.js"></script>
  <script src="../js/behaviour.js?v=20260413-1"></script>
  <script src="../js/ui_feedback.js?v=20260406-1"></script>
  <script>
    let galleryContext = null;
    let galleryImages = [];
    const pageText = (en, tr) => window.appLocaleText ? window.appLocaleText({ en, tr }) : en;

    function galleryEscapeHtml(value) {
      return String(value ?? "")
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function galleryToast(message, tone = 'info') {
      if (window.AppUI?.toast) {
        window.AppUI.toast(message, tone);
        return;
      }

      if (tone === 'error' || tone === 'warning') {
        window.alert(message);
        return;
      }

      console.info(message);
    }

    async function requestGalleryConfirm(config) {
      if (window.AppUI?.confirm) {
        return window.AppUI.confirm(config);
      }

      return window.confirm(config?.message || 'Continue?');
    }

    function renderGallery(images) {
      return `
        <div class="gallery-grid">
          ${images.map((image) => `
            <article class="gallery-card">
              <img
                src="${galleryEscapeHtml(image.file_path)}"
                alt="${galleryEscapeHtml(image.title || 'Gallery image')}"
                onclick="openLightboxById(${Number(image.id)})"
              >
              <div class="gallery-card__body">
                <strong class="gallery-card__title">${galleryEscapeHtml(image.title || 'Club memory')}</strong>
                <span class="gallery-card__meta">${galleryEscapeHtml(image.source_blog_id ? `Linked to blog post: ${image.source_blog_title || `#${image.source_blog_id}`}` : 'Standalone gallery image')}</span>
                ${
                  galleryContext?.can_manage_club && Number(image.id) > 0
                    ? `<button type="button" class="ui-button-danger" onclick="deleteImage(${image.id}, ${image.source_blog_id ? 'true' : 'false'})">${image.source_blog_id ? pageText('Remove from gallery', 'Galeriden kaldir') : pageText('Delete', 'Sil')}</button>`
                    : ''
                }
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    async function loadGalleryPage() {
      const [context, images] = await Promise.all([
        window.appFetchJson('../services/get_session_context.php'),
        window.appFetchJson('../services/gallery_get.php')
      ]);

      galleryContext = context;
      if (!Array.isArray(images)) {
        throw new Error(images.error || 'Failed to load gallery images.');
      }
      galleryImages = images;

      const shell = document.getElementById('gallery-shell');
      shell.innerHTML = `
        <section class="surface hero-surface">
          <div>
            <div class="membership-chip"><i class="ri-image-2-line"></i> ${pageText('Club memories', 'Kulup anilari')}</div>
            <h1 style="margin-top: 1rem;">${pageText('Club Gallery', 'Kulup Galerisi')}</h1>
            <p style="color: var(--text-color); margin-top: 0.85rem;">
              ${pageText('Photos from blog posts, events, tournaments, and club life all collect here.', 'Blog yazilarindan, etkinliklerden, turnuvalardan ve kulup hayatindan gelen fotograflar burada toplanir.')}
            </p>
          </div>
          <div>
            <h3>${pageText('What lives here', 'Burada neler var')}</h3>
            <p style="color: var(--text-color); margin-top: 0.75rem;">
              ${pageText('Gallery images can be uploaded directly by managers/admins, and blog images can also appear here automatically.', 'Galeri gorselleri yoneticiler tarafindan dogrudan yuklenebilir; blog gorselleri de otomatik olarak burada gorunebilir.')}
            </p>
          </div>
        </section>
        <section class="summary-strip">
          <article class="summary-card"><strong>${images.length}</strong><span>${pageText('Visible images', 'Gorunen gorseller')}</span></article>
          <article class="summary-card"><strong>${images.filter((image) => Number(image.source_blog_id) > 0).length}</strong><span>${pageText('Linked to blog posts', 'Blog yazilarina bagli')}</span></article>
          <article class="summary-card"><strong>${galleryContext?.can_manage_club ? pageText('Yes', 'Evet') : pageText('No', 'Hayir')}</strong><span>${pageText('You can manage uploads', 'Yuklemeleri yonetebilirsiniz')}</span></article>
        </section>
        ${
          galleryContext?.can_manage_club
            ? `
              <section class="surface">
                <h2>${pageText('Upload gallery image', 'Galeri gorseli yukle')}</h2>
                <form id="gallery-upload-form" class="upload-form">
                  <input type="text" name="title" class="ui-input" placeholder="${pageText('Image title', 'Gorsel basligi')}">
                  <input type="file" name="image" class="ui-input" accept="image/*" required>
                  <button type="submit" class="ui-button">${pageText('Upload image', 'Gorsel yukle')}</button>
                </form>
              </section>
            `
            : ''
        }
        <section class="surface">
          ${images.length > 0 ? renderGallery(images) : `<p style="color: var(--text-color);">${pageText('No images available yet.', 'Henuz gorsel yok.')}</p>`}
        </section>
      `;

      const uploadForm = document.getElementById('gallery-upload-form');
      if (uploadForm) {
        uploadForm.addEventListener('submit', uploadImage);
      }
    }

    async function uploadImage(event) {
      event.preventDefault();
      const data = await window.appFetchJson('../services/gallery_upload.php', {
        method: 'POST',
        body: new FormData(event.currentTarget)
      });
      if (!data.success) {
        galleryToast(data.message || 'Upload failed.', 'error');
        return;
      }

      galleryToast(pageText('Image uploaded successfully.', 'Gorsel basariyla yuklendi.'), 'success');
      await loadGalleryPage();
    }

    async function deleteImage(id, linkedToBlog) {
      const message = linkedToBlog
        ? pageText('Remove this image from the gallery? The blog post will keep its image.', 'Bu gorsel galeriden kaldirilsin mi? Blog yazisi gorseli koruyacak.')
        : pageText('Delete this image from the gallery?', 'Bu gorsel galeriden silinsin mi?');

      const confirmed = await requestGalleryConfirm({
        title: linkedToBlog ? 'Remove linked gallery image' : 'Delete gallery image',
        message,
        confirmLabel: linkedToBlog ? pageText('Remove from gallery', 'Galeriden kaldir') : pageText('Delete image', 'Gorseli sil'),
        cancelLabel: pageText('Cancel', 'Iptal'),
        tone: 'danger'
      });
      if (!confirmed) {
        return;
      }

      const data = await window.appFetchJson('../services/gallery_delete.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      if (!data.success) {
        galleryToast(data.message || 'Delete failed.', 'error');
        return;
      }

      if (data.removed_from_gallery_only) {
        galleryToast(pageText('Image removed from the gallery. The blog post keeps its image.', 'Gorsel galeriden kaldirildi. Blog yazisi gorseli koruyor.'), 'success');
      }

      if (!data.removed_from_gallery_only) {
        galleryToast(pageText('Image deleted successfully.', 'Gorsel basariyla silindi.'), 'success');
      }
      await loadGalleryPage();
    }

    function openLightboxById(imageId) {
      const image = galleryImages.find((entry) => Number(entry.id) === Number(imageId));
      if (!image) {
        return;
      }

      document.getElementById('lightbox-image').src = image.file_path;
      document.getElementById('lightbox-title').textContent = image.title || 'Club memory';
      document.getElementById('lightbox-meta').textContent = image.source_blog_id
        ? pageText(`This image is linked to blog post ${image.source_blog_title || `#${image.source_blog_id}`}.`, `Bu gorsel ${image.source_blog_title || `#${image.source_blog_id}`} blog yazisina baglidir.`)
        : pageText('This image lives only in the gallery.', 'Bu gorsel yalnizca galeride bulunur.');
      document.getElementById('lightbox-actions').innerHTML = image.source_blog_id
        ? `<a class="ui-button" href="blog.html?post=${Number(image.source_blog_id)}">${pageText('Open linked post', 'Bagli yaziyi ac')}</a>`
        : '';
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.getElementById('lightbox').addEventListener('click', (event) => {
      if (event.target !== event.currentTarget) {
        return;
      }
      closeLightbox();
    });

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);

    document.addEventListener('DOMContentLoaded', () => {
      loadGalleryPage().catch((error) => {
        document.getElementById('gallery-shell').innerHTML = `<div class="surface">${galleryEscapeHtml(error.message)}</div>`;
      });
    });

    window.addEventListener('app:localechange', () => {
      if (galleryContext) {
        loadGalleryPage().catch((error) => {
          document.getElementById('gallery-shell').innerHTML = `<div class="surface">${galleryEscapeHtml(error.message)}</div>`;
        });
      }
    });

    window.openLightboxById = openLightboxById;
  </script>
</body>
</html>
