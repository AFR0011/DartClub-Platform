<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="shortcut icon" href="../files/media/images/logo.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <title>Gallery - Famagusta Dart Club</title>
  <style>
    .gallery-shell {
      padding: 7rem 0 3rem;
      display: grid;
      gap: 1.5rem;
    }

    .surface {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 1.5rem;
    }

    .gallery-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .gallery-card {
      overflow: hidden;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .gallery-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .gallery-card__body {
      padding: 0.9rem;
      display: grid;
      gap: 0.6rem;
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 2rem;
    }

    .lightbox img {
      max-width: min(100%, 1000px);
      max-height: 85vh;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <header class="header" id="header">
    <nav class="nav container">
      <a href="main.php" class="nav__logo">
        <img src="../files/media/images/logo.png" alt="logo" /> Famagusta Dart Club
      </a>
      <div class="nav__menu" id="nav-menu">
        <ul class="nav__list"></ul>
        <div class="nav__close" id="nav-close">
          <i class="ri-close-line"></i>
        </div>
      </div>
      <div class="nav__toggle" id="nav-toggle">
        <i class="ri-menu-line"></i>
      </div>
    </nav>
  </header>

  <main class="main">
    <section class="gallery-shell container" id="gallery-shell">
      <div class="surface">Loading gallery...</div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-image" alt="Gallery preview" />
  </div>

  <a href="#top" class="scrollup" id="scroll-up">
    <i class="ri-arrow-up-line"></i>
  </a>

  <script src="../js/scrollreveal.min.js"></script>
  <script src="../js/behaviour.js?v=20260402-2"></script>
  <script>
    let galleryContext = null;

    function renderGallery(images) {
      return `
        <div class="gallery-grid">
          ${images.map((image) => `
            <article class="gallery-card">
              <img src="${image.file_path}" alt="${image.title || 'Gallery image'}" onclick="openLightbox('${image.file_path}')">
              <div class="gallery-card__body">
                <strong>${image.title || 'Club memory'}</strong>
                ${image.source_blog_id ? '<span style="color: var(--text-color); font-size: 0.9rem;">Also used in a blog post</span>' : ''}
                ${
                  galleryContext?.can_manage_club && Number(image.id) > 0
                    ? `<button type="button" class="cancel-btn" onclick="deleteImage(${image.id}, ${image.source_blog_id ? 'true' : 'false'})">${image.source_blog_id ? 'Remove from gallery' : 'Delete'}</button>`
                    : ''
                }
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    async function loadGalleryPage() {
      const [contextResponse, galleryResponse] = await Promise.all([
        fetch('../services/get_session_context.php'),
        fetch('../services/gallery_get.php')
      ]);

      galleryContext = await contextResponse.json();
      const images = await galleryResponse.json();
      if (!Array.isArray(images)) {
        throw new Error(images.error || 'Failed to load gallery images.');
      }

      const shell = document.getElementById('gallery-shell');
      shell.innerHTML = `
        <section class="surface">
          <h1>Club Gallery</h1>
          <p style="color: var(--text-color); margin-top: 0.85rem;">
            Photos from blog posts, events, tournaments, and club life all collect here.
          </p>
        </section>
        ${
          galleryContext?.can_manage_club
            ? `
              <section class="surface">
                <h2>Upload gallery image</h2>
                <form id="gallery-upload-form" style="display:grid; gap: 0.8rem; margin-top: 1rem;">
                  <input type="text" name="title" placeholder="Image title">
                  <input type="file" name="image" accept="image/*" required>
                  <button type="submit" class="button">Upload image</button>
                </form>
              </section>
            `
            : ''
        }
        <section class="surface">
          ${images.length > 0 ? renderGallery(images) : '<p style="color: var(--text-color);">No images available yet.</p>'}
        </section>
      `;

      const uploadForm = document.getElementById('gallery-upload-form');
      if (uploadForm) {
        uploadForm.addEventListener('submit', uploadImage);
      }
    }

    async function uploadImage(event) {
      event.preventDefault();
      const formData = new FormData(event.currentTarget);
      const response = await fetch('../services/gallery_upload.php', {
        method: 'POST',
        body: formData
      });
      const data = await response.json();
      if (!data.success) {
        window.alert(data.message || 'Upload failed.');
        return;
      }

      await loadGalleryPage();
    }

    async function deleteImage(id, linkedToBlog) {
      const message = linkedToBlog
        ? 'Remove this image from the gallery? The blog post will keep its image.'
        : 'Delete this image from the gallery?';

      if (!window.confirm(message)) {
        return;
      }

      const response = await fetch('../services/gallery_delete.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      const data = await response.json();
      if (!data.success) {
        window.alert(data.message || 'Delete failed.');
        return;
      }

      if (data.removed_from_gallery_only) {
        window.alert('Image removed from the gallery. The blog post keeps its image.');
      }

      await loadGalleryPage();
    }

    function openLightbox(src) {
      document.getElementById('lightbox-image').src = src;
      document.getElementById('lightbox').style.display = 'flex';
    }

    document.getElementById('lightbox').addEventListener('click', () => {
      document.getElementById('lightbox').style.display = 'none';
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadGalleryPage().catch((error) => {
        document.getElementById('gallery-shell').innerHTML = `<div class="surface">${error.message}</div>`;
      });
    });
  </script>
</body>
</html>
