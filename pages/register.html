<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Membership - Famagusta Dart Club</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="shortcut icon" href="../files/media/images/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .membership-shell {
            padding: 7rem 0 3rem;
            display: grid;
            gap: 1.5rem;
        }

        .surface {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 1.5rem;
        }

        .step-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .step-card {
            padding: 1rem 1.1rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        input[type="file"] {
            width: 100%;
            padding: 0.8rem;
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.22);
            background: rgba(0, 0, 0, 0.18);
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container">
            <a href="main.php" class="nav__logo">
                <img src="../files/media/images/logo.png" alt="logo"> Famagusta Dart Club
            </a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list"></ul>
                <div class="nav__close" id="nav-close">
                    <i class="ri-close-line"></i>
                </div>
            </div>
            <div class="nav__toggle" id="nav-toggle">
                <i class="ri-menu-line"></i>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="membership-shell container" id="membership-shell">
            <div class="surface">Loading membership workflow...</div>
        </section>
    </main>

    <a href="#top" class="scrollup" id="scroll-up">
        <i class="ri-arrow-up-line"></i>
    </a>

    <script src="../js/scrollreveal.min.js"></script>
    <script src="../js/behaviour.js"></script>
    <script>
        function renderMembershipPage(context) {
            const shell = document.getElementById('membership-shell');
            shell.innerHTML = `
                <section class="surface">
                    <h1>Join the club</h1>
                    <p style="color: var(--text-color); margin-top: 0.9rem;">
                        Club membership is separate from platform roles. Players stay players, and approved club members unlock member-only features such as blog draft authoring.
                    </p>
                </section>

                <section class="surface">
                    <h2>How the workflow works</h2>
                    <div class="step-grid" style="margin-top: 1rem;">
                        <article class="step-card">
                            <strong>1. Create your player profile</strong>
                            <p style="color: var(--text-color); margin-top: 0.6rem;">Your profile powers tournament registration and helps managers identify you.</p>
                        </article>
                        <article class="step-card">
                            <strong>2. Submit your membership form</strong>
                            <p style="color: var(--text-color); margin-top: 0.6rem;">Upload the filled membership form from this page.</p>
                        </article>
                        <article class="step-card">
                            <strong>3. Wait for review</strong>
                            <p style="color: var(--text-color); margin-top: 0.6rem;">Managers and admins review applications and approve or reject them.</p>
                        </article>
                    </div>
                </section>

                <section class="surface">
                    <h2>Membership status</h2>
                    <p style="margin-top: 0.75rem;"><strong>Current state:</strong> ${context.membership_status.replaceAll('_', ' ')}</p>
                    <p style="color: var(--text-color); margin-top: 0.6rem;">
                        ${
                          !context.logged_in
                            ? 'Sign in first to submit an application.'
                            : !context.has_player_profile
                                ? 'Complete your player profile before submitting the form.'
                                : context.membership_status === 'approved'
                                    ? 'You are already an approved club member.'
                                    : 'Upload your latest membership form below.'
                        }
                    </p>
                </section>

                <section class="surface">
                    <h2>Downloads</h2>
                    <p style="color: var(--text-color); margin-top: 0.75rem;">Download the club forms, complete them, and upload the membership form below.</p>
                    <div class="step-grid" style="margin-top: 1rem;">
                        <a class="button" href="../other/athleteform.docx">Athlete Registration Form</a>
                        <a class="button" href="../other/memberform.docx">Member Registration Form</a>
                    </div>
                </section>

                <section class="surface">
                    <h2>Submit membership application</h2>
                    <form id="membership-form" style="margin-top: 1rem;">
                        <label for="membership-file">Membership form</label>
                        <input id="membership-file" name="form" type="file" accept=".pdf,.doc,.docx" ${(!context.logged_in || !context.has_player_profile || context.membership_status === 'approved') ? 'disabled' : ''} required>
                        <button type="submit" class="button" style="margin-top: 1rem;" ${(!context.logged_in || !context.has_player_profile || context.membership_status === 'approved') ? 'disabled' : ''}>Submit application</button>
                    </form>
                </section>
            `;

            const form = document.getElementById('membership-form');
            if (form) {
                form.addEventListener('submit', submitMembershipApplication);
            }
        }

        async function loadContext() {
            const response = await fetch('../services/get_session_context.php');
            return response.json();
        }

        async function submitMembershipApplication(event) {
            event.preventDefault();
            const fileInput = document.getElementById('membership-file');
            if (!fileInput.files[0]) {
                window.alert('Please choose a file first.');
                return;
            }

            const formData = new FormData();
            formData.append('form', fileInput.files[0]);

            const response = await fetch('../services/submit_membership_application.php', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (!data.success) {
                window.alert(data.message || 'Failed to submit application.');
                return;
            }

            window.alert(data.message);
            const context = await loadContext();
            renderMembershipPage(context);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const context = await loadContext();
                renderMembershipPage(context);
            } catch (error) {
                document.getElementById('membership-shell').innerHTML = `<div class="surface">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
