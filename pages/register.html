<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Membership - Famagusta Dart Club</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="shortcut icon" href="../files/media/images/logo.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .membership-shell {
            padding: 7rem 0 3rem;
            display: grid;
            gap: 1.5rem;
        }

        .surface {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 1.5rem;
        }

        .step-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .step-card {
            padding: 1rem 1.1rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        input[type="file"] {
            width: 100%;
            padding: 0.8rem;
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.22);
            background: rgba(0, 0, 0, 0.18);
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container">
            <a href="main.php" class="nav__logo">
                <img src="../files/media/images/logo.png" alt="logo"> Famagusta Dart Club
            </a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list"></ul>
                <div class="nav__close" id="nav-close">
                    <i class="ri-close-line"></i>
                </div>
            </div>
            <div class="nav__toggle" id="nav-toggle">
                <i class="ri-menu-line"></i>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="membership-shell container" id="membership-shell">
            <div class="surface" data-i18n-en="Loading membership workflow..." data-i18n-tr="Uyelik sureci yukleniyor...">Loading membership workflow...</div>
        </section>
    </main>

    <a href="#top" class="scrollup" id="scroll-up">
        <i class="ri-arrow-up-line"></i>
    </a>

    <script src="../js/scrollreveal.min.js"></script>
    <script src="../js/behaviour.js?v=20260413-1"></script>
    <script>
        const pageText = (en, tr) => window.appLocaleText ? window.appLocaleText({ en, tr }) : en;

        function renderMembershipPage(context) {
            const shell = document.getElementById('membership-shell');
            shell.innerHTML = `
                <section class="surface">
                    <h1>${pageText('Join the club', 'Kulube katil')}</h1>
                    <p style="color: var(--text-color); margin-top: 0.9rem;">
                        ${pageText('Club membership is separate from platform roles. Players stay players, and approved club members unlock member-only features such as blog draft authoring.', 'Kulup uyeligi platform rollerinden ayridir. Oyuncular oyuncu olarak kalir; onayli kulup uyeleri blog taslagi yazmak gibi uye-ozel ozelliklerin kilidini acar.')}
                    </p>
                </section>

                <section class="surface">
                    <h2>${pageText('How the workflow works', 'Surec nasil isliyor')}</h2>
                    <div class="step-grid" style="margin-top: 1rem;">
                        <article class="step-card">
                            <strong>${pageText('1. Create your player profile', '1. Oyuncu profilinizi olusturun')}</strong>
                            <p style="color: var(--text-color); margin-top: 0.6rem;">${pageText('Your profile powers tournament registration and helps managers identify you.', 'Profiliniz turnuva kayitlarini destekler ve yoneticilerin sizi tanimasina yardim eder.')}</p>
                        </article>
                        <article class="step-card">
                            <strong>${pageText('2. Submit your membership form', '2. Uyelik formunuzu gonderin')}</strong>
                            <p style="color: var(--text-color); margin-top: 0.6rem;">${pageText('Upload the filled membership form from this page.', 'Doldurulmus uyelik formunu bu sayfadan yukleyin.')}</p>
                        </article>
                        <article class="step-card">
                            <strong>${pageText('3. Wait for review', '3. Inceleme icin bekleyin')}</strong>
                            <p style="color: var(--text-color); margin-top: 0.6rem;">${pageText('Managers and admins review applications and approve or reject them.', 'Yoneticiler ve adminler basvurulari inceler, onaylar veya reddeder.')}</p>
                        </article>
                    </div>
                </section>

                <section class="surface">
                    <h2>${pageText('Membership status', 'Uyelik durumu')}</h2>
                    <p style="margin-top: 0.75rem;"><strong>${pageText('Current state:', 'Guncel durum:')}</strong> ${context.membership_status.replaceAll('_', ' ')}</p>
                    <p style="color: var(--text-color); margin-top: 0.6rem;">
                        ${
                          !context.logged_in
                            ? pageText('Sign in first to submit an application.', 'Basvuru gondermek icin once giris yapin.')
                            : !context.has_player_profile
                                ? pageText('Complete your player profile before submitting the form.', 'Formu gondermeden once oyuncu profilinizi tamamlayin.')
                                : context.membership_status === 'approved'
                                    ? pageText('You are already an approved club member.', 'Zaten onayli bir kulup uyesisiniz.')
                                    : pageText('Upload your latest membership form below.', 'En guncel uyelik formunuzu asagidan yukleyin.')
                        }
                    </p>
                </section>

                <section class="surface">
                    <h2>${pageText('Downloads', 'Indirmeler')}</h2>
                    <p style="color: var(--text-color); margin-top: 0.75rem;">${pageText('Download the club forms, complete them, and upload the membership form below.', 'Kulup formlarini indirin, doldurun ve uyelik formunu asagidan yukleyin.')}</p>
                    <div class="step-grid" style="margin-top: 1rem;">
                        <a class="button" href="../other/athleteform.docx" download data-skip-transition="true">${pageText('Athlete Registration Form', 'Sporcu Kayit Formu')}</a>
                        <a class="button" href="../other/memberform.docx" download data-skip-transition="true">${pageText('Member Registration Form', 'Uye Kayit Formu')}</a>
                    </div>
                </section>

                <section class="surface">
                    <h2>${pageText('Submit membership application', 'Uyelik basvurusu gonder')}</h2>
                    <form id="membership-form" style="margin-top: 1rem;">
                        <label for="membership-file">${pageText('Membership form', 'Uyelik formu')}</label>
                        <input id="membership-file" name="form" type="file" accept=".pdf,.doc,.docx" ${(!context.logged_in || !context.has_player_profile || context.membership_status === 'approved') ? 'disabled' : ''} required>
                        <button type="submit" class="button" style="margin-top: 1rem;" ${(!context.logged_in || !context.has_player_profile || context.membership_status === 'approved') ? 'disabled' : ''}>${pageText('Submit application', 'Basvuruyu gonder')}</button>
                    </form>
                </section>
            `;

            const form = document.getElementById('membership-form');
            if (form) {
                form.addEventListener('submit', submitMembershipApplication);
            }
        }

        async function loadContext() {
            return window.appFetchJson('../services/get_session_context.php');
        }

        async function submitMembershipApplication(event) {
            event.preventDefault();
            const fileInput = document.getElementById('membership-file');
            if (!fileInput.files[0]) {
                window.alert(pageText('Please choose a file first.', 'Lutfen once bir dosya secin.'));
                return;
            }

            const formData = new FormData();
            formData.append('form', fileInput.files[0]);

            let data;
            try {
                data = await window.appFetchJson('../services/submit_membership_application.php', {
                    method: 'POST',
                    body: formData
                });
            } catch (error) {
                window.alert(error.message || 'Failed to submit application.');
                return;
            }

            window.alert(data.message);
            const context = await loadContext();
            renderMembershipPage(context);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const context = await loadContext();
                renderMembershipPage(context);
            } catch (error) {
                document.getElementById('membership-shell').innerHTML = `<div class="surface">${error.message}</div>`;
            }
        });

        window.addEventListener('app:localechange', async () => {
            try {
                const context = await loadContext();
                renderMembershipPage(context);
            } catch (error) {
                document.getElementById('membership-shell').innerHTML = `<div class="surface">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
