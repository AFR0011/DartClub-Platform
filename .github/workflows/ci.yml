name: Dart Club CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: dart_club
          MARIADB_ROOT_PASSWORD: dart_club_ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Repository inventory
        run: python3 scripts/repository_inventory.py

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, fileinfo, zip, dom
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install --yes mariadb-client

      - name: Import deterministic schema
        env:
          MARIADB_PWD: dart_club_ci_root
        run: mariadb --host=127.0.0.1 --user=root dart_club < dart_club.sql

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Publication guard
        run: python3 scripts/publication_guard.py

      - name: Security smoke
        run: php scripts/security_smoke.php

      - name: Database and HTTP integration contracts
        env:
          APP_ENV: development
          APP_DB_HOST: 127.0.0.1
          APP_DB_PORT: 3306
          APP_DB_NAME: dart_club
          APP_DB_USER: root
          APP_DB_PASS: dart_club_ci_root
        run: |
          php tests/prepare_integration_fixture.php
          php tests/tournament_contracts.php
          python3 tests/http_integration.py

      - name: PHP syntax scan
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              status=1
            fi
          done < <(find . -path './vendor' -prune -o -name '*.php' -print0)
          exit "$status"
