name: Remove Tracked Composer Vendor

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v7
        with:
          ref: publication/dart-club-release

      - name: Remove tracked Composer vendor files
        run: git rm -r vendor

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove tracked Composer vendor directory"
          git push origin HEAD:publication/dart-club-release
