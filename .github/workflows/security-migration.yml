name: Publication Security Migration

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v7
        with:
          ref: publication/dart-club-release

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, fileinfo, zip
          coverage: none

      - name: Apply deterministic security migration
        run: python3 scripts/apply_publication_security_migration.py

      - name: Verify publication guard
        run: python3 scripts/publication_guard.py

      - name: Verify PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              status=1
            fi
          done < <(find services -name '*.php' -print0)
          exit "$status"

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dart_club.sql services
          if git diff --cached --quiet; then
            echo "Security migration already matches the branch."
          else
            git commit -m "Apply publication security migration"
            git push origin HEAD:publication/dart-club-release
          fi
