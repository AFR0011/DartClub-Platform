name: Public Docs Path Cleanup

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v7
        with:
          ref: publication/dart-club-release

      - name: Remove machine-specific local paths from docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              r'C:\Users\Ali\xampp\php\php.exe': 'php',
              r'C:\Users\Ali\xampp\mysql\bin\mysql.exe': 'mysql',
          }

          changed = []
          for path in Path('docs').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('updated docs:', changed)
          PY

      - name: Verify publication guard
        run: python3 scripts/publication_guard.py

      - name: Commit cleaned docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No machine-specific paths required cleanup."
          else
            git commit -m "Remove machine-specific paths from public docs"
            git push origin HEAD:publication/dart-club-release
          fi
